services:
  web:
    build: .
    container_name: nebula-web
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: nebula-redis
    restart: unless-stopped
